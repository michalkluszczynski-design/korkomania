<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korkomania - Zarządzanie Korepetycjami</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #0F2537;
      --accent: #F59E0B;
      --bg: #FAF9F6;
      --card-bg: #FFFFFF;
      --border: #E5E7EB;
      --text: #111827;
      --text-muted: #6B7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

    /* EKRAN LOGOWANIA */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background-color: var(--primary);
      color: #FFF;
    }
    .auth-card {
      background: #FFF;
      color: var(--text);
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; text-align: center; color: var(--primary); }

    /* APPOWY INTERFEJS */
    #app-container { display: none; }
    header { background-color: var(--primary); color: #FFF; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; }
    .logo span { color: var(--accent); }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: rgba(255, 255, 255, 0.2); border: none; width: 36px; height: 36px; border-radius: 50%; color: #FFF; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .icon-btn.accent { background-color: var(--accent); }

    main { max-width: 600px; margin: 0 auto; padding: 15px 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .metrics-grid { display: flex; gap: 8px; margin-bottom: 20px; }
    .metric-card { flex: 1; background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border); text-align: center; cursor: pointer; }
    .metric-value { font-size: 16px; font-weight: 700; margin-top: 4px; }
    .metric-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    .section-title { font-size: 15px; font-weight: 700; margin: 15px 0 10px 0; display: flex; justify-content: space-between; align-items: center; }

    .lesson-card, .student-card { background: var(--card-bg); border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border: 1px solid var(--border); }
    .lesson-card.cancelled { background: #F3F4F6; opacity: 0.7; }

    .badge-btn { padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; }
    .badge-paid { background: #D1FAE5; color: #059669; }
    .badge-unpaid { background: #FEE2E2; color: #DC2626; }

    .chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
    .chip { background: var(--card-bg); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--primary); color: #FFF; }

    nav { position: fixed; bottom: 0; left: 0; right: 0; background: #FFF; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 80; }
    .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; }
    .nav-item.active { color: var(--primary); }

    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal.active { display: flex; }
    .modal-body { background: #FFF; border-radius: 16px; padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #4B5563; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #F9FAFB; }
    .btn-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 13px; width: 100%; }
    .btn-primary { background: var(--primary); color: #FFF; }
    .btn-secondary { background: #E5E7EB; color: #374151; }
    .btn-danger { background: #FEE2E2; color: #DC2626; }
  </style>
</head>
<body>

  <!-- 1. EKRAN LOGOWANIA -->
  <div id="auth-screen">
    <div class="logo" style="margin-bottom: 25px; font-size: 28px;">
      <i data-lucide="calendar"></i> korko<span style="color:var(--accent)">mania</span>
    </div>
    <div class="auth-card">
      <div class="auth-title" id="auth-header-title">Zaloguj się</div>
      <div class="form-group">
        <label>Adres E-mail</label>
        <input type="email" class="form-control" id="auth-email" placeholder="twój@email.com">
      </div>
      <div class="form-group">
        <label>Hasło</label>
        <input type="password" class="form-control" id="auth-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="auth-submit-btn" onclick="handleAuth()" style="margin-top: 10px;">Zaloguj się</button>
      <button class="btn btn-secondary" onclick="toggleAuthMode()" id="auth-toggle-btn" style="margin-top: 8px;">Nie masz konta? Zarejestruj się</button>
    </div>
  </div>

  <!-- 2. GŁÓWNA APLIKACJA -->
  <div id="app-container">
    <header>
      <div class="logo"><i data-lucide="calendar"></i> korko<span>mania</span></div>
      <div class="header-actions">
        <button class="icon-btn" onclick="showTab('ustawienia')"><i data-lucide="settings"></i></button>
        <button class="icon-btn accent" onclick="openAddLessonModal()"><i data-lucide="plus"></i></button>
      </div>
    </header>

    <main>
      <!-- PULPIT -->
      <section id="pulpit" class="tab-content active">
        <div class="metrics-grid">
          <div class="metric-card" onclick="showTab('kalendarz')">
            <i data-lucide="book-open"></i>
            <div class="metric-value" id="today-count">0</div>
            <div class="metric-label">Lekcje dzisiaj</div>
          </div>
          <div class="metric-card" onclick="showTab('finanse')">
            <i data-lucide="wallet" style="color: #059669;"></i>
            <div class="metric-value" id="month-revenue">0 zł</div>
            <div class="metric-label">Przychód m-ca</div>
          </div>
          <div class="metric-card" onclick="showTab('uczniowie')">
            <i data-lucide="users" style="color: #F59E0B;"></i>
            <div class="metric-value" id="students-count">0</div>
            <div class="metric-label">Baza uczniów</div>
          </div>
        </div>
        <div class="section-title">Dzisiejsze Lekcje</div>
        <div id="today-lessons-list"></div>
      </section>

      <!-- KALENDARZ -->
      <section id="kalendarz" class="tab-content">
        <div class="section-title">Wybierz Dzień:</div>
        <div class="chip-scroll" id="cal-days"></div>
        <div class="section-title" id="cal-day-title">Lekcje w dniu:</div>
        <div id="cal-day-lessons"></div>
      </section>

      <!-- UCZNIOWIE -->
      <section id="uczniowie" class="tab-content">
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
          <input type="text" class="form-control" id="student-search" placeholder="Szukaj ucznia..." oninput="renderStudents()">
          <button class="btn btn-primary" onclick="openStudentModal()" style="width: auto;"><i data-lucide="user-plus"></i></button>
        </div>
        <div id="students-list"></div>
      </section>

      <!-- FINANSE -->
      <section id="finanse" class="tab-content">
        <div class="section-title">Podsumowanie Finansowe</div>
        <div style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px;">
          <div style="font-size: 12px; color: var(--text-muted); font-weight: 700;">CAŁKOWITY PRZYCHÓD MIESIĄCA</div>
          <div style="font-size: 22px; font-weight: 700;" id="fin-total">0 zł</div>
        </div>
        <div id="fin-lessons-list"></div>
      </section>

      <!-- USTAWIENIA -->
      <section id="ustawienia" class="tab-content">
        <div class="section-title">Konto i Motyw</div>
        <button class="btn btn-danger" onclick="handleLogout()" style="margin-bottom: 15px;">Wyloguj się</button>
      </section>
    </main>

    <nav id="navbar">
      <button class="nav-item active" onclick="showTab('pulpit')"><i data-lucide="home"></i>Pulpit</button>
      <button class="nav-item" onclick="showTab('kalendarz')"><i data-lucide="calendar"></i>Kalendarz</button>
      <button class="nav-item" onclick="showTab('uczniowie')"><i data-lucide="users"></i>Uczniowie</button>
      <button class="nav-item" onclick="showTab('finanse')"><i data-lucide="wallet"></i>Finanse</button>
    </nav>
  </div>

  <!-- MODAL LEKCJI -->
  <div class="modal" id="add-lesson-modal">
    <div class="modal-body">
      <div class="section-title">Planuj Nową Lekcję</div>
      <div class="form-group"><label>Uczeń</label><select class="form-control" id="l-student"></select></div>
      <div class="form-group"><label>Przedmiot</label>
        <select class="form-control" id="l-subject">
          <option>Matematyka podst.</option><option>Matematyka rozszerz.</option><option>Angielski podst.</option><option>Angielski rozszerz.</option>
        </select>
      </div>
      <div class="form-group"><label>Data</label><input type="date" class="form-control" id="l-date"></div>
      <div class="form-group"><label>Godzina</label><input type="time" class="form-control" id="l-time" value="16:00"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal('add-lesson-modal')">Anuluj</button>
        <button class="btn btn-primary" onclick="saveNewLesson()">Dodaj Lekcję</button>
      </div>
    </div>
  </div>

  <!-- MODAL UCZNIA -->
  <div class="modal" id="student-modal">
    <div class="modal-body">
      <div class="section-title">Dodaj Ucznia</div>
      <div class="form-group"><label>Imię i Nazwisko</label><input type="text" class="form-control" id="s-name" placeholder="np. Jan Kowalski"></div>
      <div class="form-group"><label>Przedmiot</label>
        <select class="form-control" id="s-subject"><option>Matematyka podst.</option><option>Matematyka rozszerz.</option><option>Angielski podst.</option><option>Angielski rozszerz.</option></select>
      </div>
      <div class="form-group"><label>Stawka (zł/h)</label><input type="number" class="form-control" id="s-rate" value="80"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal('student-modal')">Anuluj</button>
        <button class="btn btn-primary" onclick="saveStudent()">Zapisz</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xxfristfiusislkixphf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_KKZPJxzb-EUEt36xLHh7HQ_C1ooGAxy';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TODAY = new Date().toISOString().split('T')[0];
    let currentUser = null;
    let isRegisterMode = false;
    let students = [];
    let lessons = [];

    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        showApp();
      } else {
        showAuth();
      }

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        if (session) {
          currentUser = session.user;
          showApp();
        } else {
          currentUser = null;
          showAuth();
        }
      });
      lucide.createIcons();
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-header-title').innerText = isRegisterMode ? 'Zarejestruj się' : 'Zaloguj się';
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Utwórz konto' : 'Zaloguj się';
      document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? 'Masz już konto? Zaloguj się' : 'Nie masz konta? Zarejestruj się';
    }

    async function handleAuth() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert('Podaj e-mail oraz hasło!');

      if (isRegisterMode) {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert('Błąd rejestracji: ' + error.message);
        else alert('Konto utworzone! Możesz się zalogować.');
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert('Błąd logowania: ' + error.message);
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }

    function showAuth() {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-container').style.display = 'none';
    }

    async function showApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      await loadData();
      renderAll();
    }

    async function loadData() {
      if (!currentUser) return;
      const { data: sData } = await supabaseClient.from('students').select('*').eq('user_id', currentUser.id);
      const { data: lData } = await supabaseClient.from('lessons').select('*').eq('user_id', currentUser.id);
      students = sData || [];
      lessons = lData || [];
    }

    async function saveStudent() {
      const name = document.getElementById('s-name').value;
      const subject = document.getElementById('s-subject').value;
      const rate = parseFloat(document.getElementById('s-rate').value) || 80;
      if (!name) return alert('Wpisz imię!');

      await supabaseClient.from('students').insert([{ name, subject, rate, user_id: currentUser.id }]);
      closeModal('student-modal');
      await loadData();
      renderAll();
    }

    async function saveNewLesson() {
      const studentId = document.getElementById('l-student').value;
      const student = students.find(s => s.id === studentId);
      const date = document.getElementById('l-date').value;
      const startHour = document.getElementById('l-time').value;
      const price = student ? (parseFloat(student.rate) || 80) : 80;

      await supabaseClient.from('lessons').insert([{
        student_id: studentId,
        subject: document.getElementById('l-subject').value,
        date: date,
        month: date.substring(0, 7),
        start_hour: startHour,
        duration_hours: 1,
        price: price,
        is_paid: false,
        is_cancelled: false,
        user_id: currentUser.id
      }]);

      closeModal('add-lesson-modal');
      await loadData();
      renderAll();
    }

    async function togglePaid(id) {
      const l = lessons.find(item => item.id === id);
      if (!l) return;
      await supabaseClient.from('lessons').update({ is_paid: !l.is_paid }).eq('id', id);
      await loadData();
      renderAll();
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      renderAll();
    }

    function renderAll() {
      document.getElementById('today-count').innerText = lessons.filter(l => l.date === TODAY && !l.is_cancelled).length;
      document.getElementById('students-count').innerText = students.length;

      const currentMonth = TODAY.substring(0, 7);
      const total = lessons.filter(l => l.month === currentMonth && !l.is_cancelled).reduce((a, b) => a + (b.price || 0), 0);
      document.getElementById('month-revenue').innerText = `${total} zł`;
      document.getElementById('fin-total').innerText = `${total} zł`;

      document.getElementById('today-lessons-list').innerHTML = lessons.filter(l => l.date === TODAY).map(l => {
        const s = students.find(st => st.id === l.student_id);
        return `<div class="lesson-card"><div><strong>${s?s.name:'Uczeń'}</strong><br><small>${l.subject} • ${l.start_hour}</small></div><button class="badge-btn ${l.is_paid?'badge-paid':'badge-unpaid'}" onclick="togglePaid('${l.id}')">${l.is_paid?'Opłacone':'Nieopłacone'}</button></div>`;
      }).join('') || '<div style="color:var(--text-muted); text-align:center;">Brak lekcji na dziś.</div>';

      document.getElementById('students-list').innerHTML = students.map(s => `<div class="student-card"><div><strong>${s.name}</strong><br><small>${s.subject} • ${s.rate} zł/h</small></div></div>`).join('');
      lucide.createIcons();
    }

    function openAddLessonModal() {
      const sel = document.getElementById('l-student');
      sel.innerHTML = students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      openModal('add-lesson-modal');
    }
    function openStudentModal() { openModal('student-modal'); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    initAuth();
  </script>
</body>
</html>
